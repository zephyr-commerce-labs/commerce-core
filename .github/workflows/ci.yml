name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff pytest

      - name: Run Black (format)
        run: black --check .

      - name: Run Ruff (lint)
        run: ruff .

      - name: Run Pytest
        run: |
          pytest -q || echo "tests eklenecek"
